<!DOCTYPE html>
<!-- S.E.R.A — written with AI assistance (Claude), reviewed by team VAA. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.E.R.A — Safe Exploration &amp; Returning Assistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">S.E.R.A</span>
      <span class="brand-sub">Safe Exploration &amp; Returning Assistant</span>
    </div>
    <nav class="zoom-steps" aria-label="Map scale">
      <button type="button" data-view="mars">Mars</button>
      <button type="button" data-view="gale">Gale Crater</button>
      <button type="button" data-view="eva">EVA zone</button>
    </nav>
  </header>

  <main class="layout">
    <div class="map-col">
      <div id="map" aria-label="Map of Mars"></div>
      <div id="profile" class="profile" hidden aria-label="Elevation profile of the route"></div>
      <ul class="legend" aria-label="Map legend">
        <li><span class="sw sw-out"></span>Route out</li>
        <li><span class="sw sw-home"></span>Way home</li>
        <li><span class="sw sw-caution"></span>Slope 15–25° · caution</li>
        <li><span class="sw sw-block"></span>Slope over 25° · no-go</li>
        <li><span class="sw sw-zone"></span>EVA zone 2 × 2 km</li>
        <li><span class="sw sw-base">H</span>Base</li>
        <li><span class="sw sw-stop">1</span>Science point</li>
      </ul>
    </div>
    <aside class="panel" aria-label="EVA plan">
      <h2>Mars now · EVA zone</h2>
      <div id="clock" class="clock"></div>
      <h2>EVA plan</h2>
      <div id="verdict" class="verdict" hidden></div>
      <p id="hint" class="hint"></p>
      <div class="controls">
        <label for="start-time">EVA start · local solar time</label>
        <input type="time" id="start-time" value="09:00">
        <button type="button" id="btn-now" class="btn-small">Now</button>
      </div>
      <ol id="stops" class="stops"></ol>
      <div id="summary" class="summary" hidden></div>
      <ul id="factors" class="factors"></ul>
      <div class="panel-actions">
        <button type="button" id="btn-storm" class="btn-secondary" aria-pressed="false">Simulate solar storm</button>
        <button type="button" id="btn-clear" class="btn-secondary">Clear plan</button>
      </div>
    </aside>
  </main>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="data/terrain.js?v=1"></script>
  <script src="data/rems.js?v=1"></script>
  <script src="js/terrain.js?v=1"></script>
  <script src="js/pathfinding.js?v=2"></script>
  <script src="js/planner.js?v=1"></script>
  <script src="js/marstime.js?v=1"></script>
  <script src="js/risk.js?v=2"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
